name: delivery_app
description: "NOVA Commerce Delivery Driver App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  nova_core:
    path: ../nova_core
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  get_it: ^8.0.3
  injectable: ^2.5.0
  provider: ^6.1.2
  socket_io_client: ^3.0.2
  google_maps_flutter: ^2.12.1
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1
  intl: ^0.20.2
  equatable: ^2.0.7
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.6.3
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/
